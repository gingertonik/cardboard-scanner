name: Build Cardboard Scanner (Python)

# PyInstaller cannot cross-compile, so each OS builds on its own runner.
on:
  push:
    # No `paths` filter here on purpose: GitHub applies path filters to tag pushes too, so
    # tagging a commit that doesn't touch python/** would silently skip the release build.
    branches: [main, python-rewrite]
    tags: ['v*']
  pull_request:
    paths: ['python/**']
  workflow_dispatch:

defaults:
  run:
    working-directory: python

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact: CardboardScanner-windows
          - os: macos-latest
            label: macOS
            artifact: CardboardScanner-macos
          - os: ubuntu-latest
            label: Linux
            artifact: CardboardScanner-linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements-dev.txt

      # OpenCV and Qt need system libraries that headless Ubuntu images omit.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libglib2.0-0 libsm6 libxext6 libxrender1 \
            libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      # Gate the build on the headless checks: catches broken logic before packaging.
      - name: Self-test (from source)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python selftest.py

      - name: Build with PyInstaller
        run: pyinstaller packaging/cardboard.spec --noconfirm

      # The frozen app is what users actually run, so verify it too. This is what caught
      # OCR silently failing because Pillow had been excluded from the bundle.
      - name: Self-test (frozen build)
        if: runner.os == 'Windows'
        run: |
          ./dist/CardboardScanner.exe --selftest
          if (Select-String -Path "$env:TEMP\cardboard_selftest.log" -Pattern "FAIL") {
            Get-Content "$env:TEMP\cardboard_selftest.log"; exit 1
          }
          Get-Content "$env:TEMP\cardboard_selftest.log"
        shell: pwsh

      - name: Self-test (frozen build)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/CardboardScanner --selftest || true
          cat "${TMPDIR:-/tmp}/cardboard_selftest.log"
          grep -q FAIL "${TMPDIR:-/tmp}/cardboard_selftest.log" && exit 1 || exit 0

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/CardboardScanner.exe -DestinationPath ${{ matrix.artifact }}.zip
        shell: pwsh

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/Cardboard Scanner.app" ${{ matrix.artifact }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.artifact }}.tar.gz -C dist CardboardScanner

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            python/${{ matrix.artifact }}.zip
            python/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach builds to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            Cardboard Scanner — standalone builds. No install required.

            - **Windows**: unzip and run `CardboardScanner.exe`. SmartScreen may warn
              because the build is unsigned: **More info -> Run anyway**.
            - **macOS**: unzip and move `Cardboard Scanner.app` to Applications. It is
              unsigned, so the first launch needs **right-click -> Open**, and macOS will
              ask for camera permission.
            - **Linux**: `tar -xzf CardboardScanner-linux.tar.gz && ./CardboardScanner`

            A pre-built index of ~116k cards is bundled, so scanning works immediately;
            only cards printed since the build date are fetched on first run.
